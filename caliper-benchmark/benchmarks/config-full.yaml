test:
  name: bansos-benchmark
  description: Pengujian performa sistem penyaluran bantuan sosial
  workers:
    number: 1
  rounds:
    - label: create-100
      txNumber: 100
      rateControl:
        type: fixed-rate
        opts:
          tps: 3
      workload:
        module: workload/create-pengajuan.js
    - label: create-300
      txNumber: 300
      rateControl:
        type: fixed-rate
        opts:
          tps: 3
      workload:
        module: workload/create-pengajuan.js
    - label: create-500
      txNumber: 500
      rateControl:
        type: fixed-rate
        opts:
          tps: 3
      workload:
        module: workload/create-pengajuan.js
    - label: read-100
      txNumber: 100
      rateControl:
        type: fixed-rate
        opts:
          tps: 15
      workload:
        module: workload/read-pengajuan.js
    - label: read-300
      txNumber: 300
      rateControl:
        type: fixed-rate
        opts:
          tps: 15
      workload:
        module: workload/read-pengajuan.js
    - label: read-500
      txNumber: 500
      rateControl:
        type: fixed-rate
        opts:
          tps: 15
      workload:
        module: workload/read-pengajuan.js
