test:
  name: bansos-benchmark-fullscale
  description: Pengujian performa skala penuh (1000/3000/5000 transaksi)
  workers:
    number: 1
  rounds:
    - label: create-1000
      txNumber: 1000
      rateControl:
        type: fixed-rate
        opts:
          tps: 3
      workload:
        module: workload/create-pengajuan.js
    - label: create-3000
      txNumber: 3000
      rateControl:
        type: fixed-rate
        opts:
          tps: 3
      workload:
        module: workload/create-pengajuan.js
    - label: create-5000
      txNumber: 5000
      rateControl:
        type: fixed-rate
        opts:
          tps: 3
      workload:
        module: workload/create-pengajuan.js
    - label: read-1000
      txNumber: 1000
      rateControl:
        type: fixed-rate
        opts:
          tps: 15
      workload:
        module: workload/read-pengajuan.js
    - label: read-3000
      txNumber: 3000
      rateControl:
        type: fixed-rate
        opts:
          tps: 15
      workload:
        module: workload/read-pengajuan.js
    - label: read-5000
      txNumber: 5000
      rateControl:
        type: fixed-rate
        opts:
          tps: 15
      workload:
        module: workload/read-pengajuan.js
